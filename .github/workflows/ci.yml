name: ci
on:
  push:
  pull_request:

jobs:
  brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run --directory brain pytest -q

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift build --package-path mac
      - run: swift test --package-path mac
